version: '3.8'

services:
  painel:
    build:
      context: . # Diretório atual onde está o Dockerfile
      dockerfile: Dockerfile # Nome do Dockerfile (opcional, se for "Dockerfile" por padrão)
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.painel.rule=Host(`myprompt.aura.doctor`)"
      - "traefik.http.services.painel.loadbalancer.server.port=3000"