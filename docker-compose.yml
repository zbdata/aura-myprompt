version: '3.8'

services:
  painel:
    image: aura-myprompt:latest # Referência à imagem criada
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.painel.rule=Host(`myprompt.aura.doctor`)"
      - "traefik.http.services.painel.loadbalancer.server.port=3000"